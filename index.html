<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiVerse Hub - Mobile Web3 App</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --accent: #8b5cf6; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 16px; }
        .header { text-align: center; margin-bottom: 24px; }
        .btn { background: var(--accent); color: white; border: none; padding: 14px 20px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-bottom: 12px; font-size: 16px; }
        .btn-pay { background: #22c55e; } /* Warna hijau untuk tombol bayar */
        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    </style>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

    <div class="header">
        <h1>🌐 PiVerse Hub</h1>
    </div>

    <div class="card" id="user-box">
        <h3>Status Pengguna</h3>
        <p><strong>Status:</strong> <span id="auth-status">Belum Terhubung</span></p>
        
        <!-- Tombol Hubungkan -->
        <button class="btn" id="btn-auth" onclick="authenticatePi()">Hubungkan Pi Wallet</button>
        
        <!-- Tombol Bayar (Awalnya disembunyikan/hidden) -->
        <button class="btn btn-pay" id="btn-pay" onclick="testPayment()" style="display: none;">🧪 Lakukan Tes Pembayaran (Langkah 10)</button>
    </div>

    <script>
        const Pi = window.Pi;
        if (typeof Pi !== 'undefined') {
            Pi.init({ version: "2.0", sandbox: true });
        }

        async function authenticatePi() {
            try {
                const scopes = ['username', 'payments'];
                const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
                
                // Update UI: Tampilkan user dan sembunyikan tombol login, tampilkan tombol bayar
                document.getElementById('auth-status').innerText = "@" + auth.user.username;
                document.getElementById('btn-auth').style.display = 'none';
                document.getElementById('btn-pay').style.display = 'block';
            } catch (err) {
                console.error(err);
                alert("Gagal terhubung: " + err);
            }
        }

        function testPayment() {
            Pi.createPayment({
                amount: 1,
                memo: "Uji Coba Langkah 10",
                metadata: { type: "test" }
            }, {
                onReadyForServerApproval: (paymentId) => console.log("ID:", paymentId),
                onReadyForServerCompletion: (paymentId, txid) => alert("Pembayaran Berhasil! Sekarang kembali ke Developer Portal."),
                onCancel: (paymentId) => alert("Dibatalkan"),
                onError: (error) => alert("Error: " + error)
            });
        }

        function onIncompletePaymentFound(payment) { console.log("Payment found"); }
    </script>
</body>
</html>
