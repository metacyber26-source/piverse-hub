<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiVerse Hub</title>
    <!-- Memuat SDK Pi -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

    <h1>PiVerse Hub</h1>
    <p>Status: <span id="user-status">Menghubungkan...</span></p>
    
    <button id="pay-btn" onclick="executeTestPayment()">Jalankan Tes Pembayaran</button>

    <script>
        // Gunakan window.addEventListener untuk memastikan SDK sudah siap
        window.addEventListener('load', () => {
            const Pi = window.Pi;
            if (!Pi) {
                document.getElementById('user-status').innerText = "SDK Gagal Dimuat";
                return;
            }

            Pi.init({ version: "2.0", sandbox: true });

            Pi.authenticate(['username'], {
                onSuccess: (user) => {
                    document.getElementById('user-status').innerText = "Halo, @" + user.username;
                },
                onFailure: () => {
                    document.getElementById('user-status').innerText = "Gagal Login";
                },
                onIncomplete: () => {
                    document.getElementById('user-status').innerText = "Login Incomplete";
                }
            });
        });

        function executeTestPayment() {
            // Cek apakah Pi sudah terinisialisasi
            if (!window.Pi) return alert("SDK belum siap");

            const paymentData = {
                amount: 1,
                memo: "Test Payment",
                metadata: { type: "test" }
            };

            const callbacks = {
                onReadyForServerApproval: (paymentId) => {
                    alert("Siap Approve. ID: " + paymentId);
                    // Jika Anda tidak punya backend, ini akan berhenti di sini
                },
                onReadyForServerCompletion: (paymentId, txid) => {
                    alert("Sukses! TXID: " + txid);
                },
                onCancel: () => alert("Dibatalkan"),
                onError: (err) => alert("Error: " + err)
            };

            window.Pi.createPayment(paymentData, callbacks);
        }
    </script>
</body>
</html>
